name: Tests

on:
  workflow_call:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linter
      run: npm run lint

    - name: Run unit tests
      run: npm test

    - name: Check production build
      run: npm run build
      env:
        VITE_FIREBASE_API_KEY: build-check
        VITE_FIREBASE_AUTH_DOMAIN: demo-kanbanish.firebaseapp.com
        VITE_FIREBASE_DATABASE_URL: https://demo-kanbanish-default-rtdb.firebaseio.com
        VITE_FIREBASE_PROJECT_ID: demo-kanbanish
        VITE_FIREBASE_APP_ID: build-check
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          vitest.results.json
          ./coverage
        if-no-files-found: ignore

  e2e-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          e2e/package-lock.json
        
    - name: Install dependencies
      run: npm ci && npm ci --prefix e2e

    - name: Set up Java for Firebase emulators
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - name: Cache test binaries
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/firebase/emulators
        key: ${{ runner.os }}-test-binaries-${{ hashFiles('package-lock.json', 'e2e/package-lock.json') }}

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
      
    - name: Run E2E tests
      run: npm run test:e2e
      
    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          test-results/
          playwright-report/
          *-debug.log
        if-no-files-found: ignore
